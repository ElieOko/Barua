spring.config.activate.on-profile=test

# Keep contextLoads lightweight (no external services)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration

sentry.enabled=false
sentry.metrics.enabled=false
sentry.logs.enabled=false

